spring.config.import=optional:file:./MtdrSpring/backend/.env[.properties],optional:file:./.env[.properties]
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
#oracle.jdbc.fanEnabled=false
##this is not used when deployed in kubernetes. Just for local testing
spring.datasource.url=jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=localhost)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=FREEPDB1)))
spring.datasource.username=${DB_USER:TODOUSER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

##Logging properties
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

llm.api.key=${OPEN_ROUTER_API_KEY:}
llm.api.url=https://openrouter.ai/api/v1/chat/completions
llm.model=${LLM_MODEL:google/gemini-2.5-flash}

# RAG / Oracle AI Vector Search
rag.embedding.model=ALL_MINILM_L12_V2
rag.retrieval.top-k=8
rag.backfill.on-startup=true
rag.worker.fixed-delay-ms=2000
rag.worker.initial-delay-ms=5000
rag.worker.batch-size=32
rag.worker.max-attempts=5

#spring.security.user.name=psong
#spring.security.user.password=WELcome__12345

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.name=${TELEGRAM_BOT_NAME:}