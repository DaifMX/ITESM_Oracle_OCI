---
name: Deploy

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        environment: prod
        outputs:
            image: ${{ steps.build.outputs.image }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'

          - name: Setup node.js
            uses: actions/setup-node@v4
            with:
                node-version: '24'

          - name: Install dependencies
            working-directory: MtdrSpring/backend/src/main/frontend
            run: npm ci --ignore-scripts

        #   - name: Build and test with Maven
        #     working-directory: MtdrSpring/backend
        #     run: |
        #         chmod +x mvnw
        #         ./mvnw verify -B

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to OCI Container Registry
            uses: docker/login-action@v3
            with:
                registry: ${{ secrets.OCI_REGION }}.ocir.io
                username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_AUTH_TOKEN }}

          - name: Build and push Docker image
            id: build
            uses: docker/build-push-action@v6
            with:
                context: MtdrSpring/backend
                push: true
                no-cache: true
                tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }}

          - name: Output image reference
            run: echo "image=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }}" >> $GITHUB_OUTPUT
            id: build_output

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-test
        environment: prod
        steps:
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4

          - name: Install OCI CLI
            run: |
                curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
                bash install.sh --accept-all-defaults
                echo "$HOME/bin" >> $GITHUB_PATH

          - name: Configure kubeconfig
            run: |
                mkdir -p $HOME/.kube
                echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config

          - name: Ensure imagePullSecrets
            run: |
                kubectl patch deployment todolistapp-springboot-deployment \
                    -n mtdrworkshop \
                    --type=json \
                    -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"oci-registry-secret"}]}]' \
                    || true

          - name: Update deployment image
            run: |
                kubectl set image deployment/todolistapp-springboot-deployment \
                    todolistapp-springboot=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }} \
                    -n mtdrworkshop

          - name: Wait for rollout
            run: kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=300s

    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        needs: deploy
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 'lts/*'

          - name: Install semantic-release
            run: npm ci

          - name: Run semantic-release
            run: npx semantic-release
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GIT_AUTHOR_NAME: github-actions[bot]
                GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                GIT_COMMITTER_NAME: github-actions[bot]
                GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
