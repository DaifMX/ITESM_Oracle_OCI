---
name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

jobs:
    # Provisions/refreshes all OCI infrastructure (OKE cluster + node pool, VCN,
    # ATP DB, bucket, container repo) from Terraform. Idempotent: a no-op when
    # everything already exists, and recreates it after an undeploy.
    infra:
        runs-on: ubuntu-latest
        environment: prod
        outputs:
            cluster_id: ${{ steps.tf.outputs.cluster_id }}
        env:
            OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
            OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
            OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
            OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
            OCI_REGION: ${{ secrets.OCI_REGION }}
            OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
            TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
            AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
            TF_VAR_ociTenancyOcid: ${{ secrets.OCI_TENANCY_OCID }}
            TF_VAR_ociUserOcid: ${{ secrets.OCI_USER_OCID }}
            TF_VAR_ociCompartmentOcid: ${{ secrets.OCI_COMPARTMENT_OCID }}
            TF_VAR_ociRegionIdentifier: ${{ secrets.OCI_REGION }}
            TF_VAR_runName: ${{ secrets.RUN_NAME }}
            TF_VAR_mtdrDbName: ${{ secrets.TODO_PDB_NAME }}
            TF_VAR_mtdrKey: ${{ secrets.MTDR_KEY }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
                terraform_wrapper: false

          - name: Install OCI CLI
            run: |
                curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
                bash install.sh --accept-all-defaults
                echo "$HOME/bin" >> $GITHUB_PATH

          - name: Configure OCI auth
            run: bash MtdrSpring/utils/ci/setup-oci-auth.sh

          - name: Terraform apply
            id: tf
            run: |
                bash MtdrSpring/utils/ci/terraform-apply.sh
                CID=$(terraform -chdir=MtdrSpring/terraform output -raw lab_oke_cluster_id)
                echo "cluster_id=$CID" >> "$GITHUB_OUTPUT"

    build:
        runs-on: ubuntu-latest
        environment: prod
        outputs:
            image: ${{ steps.build.outputs.image }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'

          - name: Setup node.js
            uses: actions/setup-node@v4
            with:
                node-version: '24'

          - name: Install dependencies
            working-directory: MtdrSpring/backend/src/main/frontend
            run: npm ci --ignore-scripts

          - name: Build with Maven
            working-directory: MtdrSpring/backend
            run: |
                chmod +x mvnw
                ./mvnw package -B -DskipTests

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to OCI Container Registry
            uses: docker/login-action@v3
            with:
                registry: ${{ secrets.OCI_REGION }}.ocir.io
                username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_AUTH_TOKEN }}

          - name: Build and push Docker image
            id: build
            uses: docker/build-push-action@v6
            with:
                context: MtdrSpring/backend
                push: true
                no-cache: true
                tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }}

          - name: Output image reference
            run: echo "image=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }}" >> $GITHUB_OUTPUT
            id: build_output

    deploy:
        runs-on: ubuntu-latest
        needs: [infra, build]
        environment: prod
        env:
            OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
            OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
            OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
            OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
            OCI_REGION: ${{ secrets.OCI_REGION }}
            OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
            OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
            OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
            TF_VAR_ociCompartmentOcid: ${{ secrets.OCI_COMPARTMENT_OCID }}
            MTDR_DB_NAME: ${{ secrets.TODO_PDB_NAME }}
            DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
            UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
            CLUSTER_ID: ${{ needs.infra.outputs.cluster_id }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up kubectl
            uses: azure/setup-kubectl@v4

          - name: Install OCI CLI
            run: |
                curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
                bash install.sh --accept-all-defaults
                echo "$HOME/bin" >> $GITHUB_PATH

          - name: Install Oracle Instant Client (sqlplus)
            run: |
                sudo apt-get update && sudo apt-get install -y alien libaio1 unzip
                BASE=https://download.oracle.com/otn_software/linux/instantclient/2113000
                curl -fsSLO $BASE/oracle-instantclient-basic-21.13.0.0.0-1.el8.x86_64.rpm
                curl -fsSLO $BASE/oracle-instantclient-sqlplus-21.13.0.0.0-1.el8.x86_64.rpm
                sudo alien -i oracle-instantclient-basic-21.13.0.0.0-1.el8.x86_64.rpm
                sudo alien -i oracle-instantclient-sqlplus-21.13.0.0.0-1.el8.x86_64.rpm
                echo "/usr/lib/oracle/21/client64/bin" >> $GITHUB_PATH

          - name: Configure OCI auth
            run: bash MtdrSpring/utils/ci/setup-oci-auth.sh

          - name: Bootstrap infra-dependent resources
            run: bash MtdrSpring/utils/ci/bootstrap-app.sh

          - name: Apply Kubernetes manifest
            working-directory: MtdrSpring/backend
            env:
                DOCKER_REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}
                TODO_PDB_NAME: ${{ secrets.TODO_PDB_NAME }}
                UI_USERNAME: ${{ secrets.UI_USERNAME }}
            run: |
                # Idempotent: creates the Deployment/Services if missing (e.g. after
                # undeploy), no-ops the rest if they already exist.
                sed -e "s|%DOCKER_REGISTRY%|${DOCKER_REGISTRY}|g" \
                    -e "s|%TODO_PDB_NAME%|${TODO_PDB_NAME}|g" \
                    -e "s|%OCI_REGION%|${OCI_REGION}|g" \
                    -e "s|%UI_USERNAME%|${UI_USERNAME}|g" \
                    src/main/resources/todolistapp-springboot.yaml \
                    | kubectl apply -n mtdrworkshop -f -

          - name: Update deployment image
            run: |
                kubectl set image deployment/todolistapp-springboot-deployment \
                    todolistapp-springboot=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ github.sha }} \
                    -n mtdrworkshop

          - name: Wait for rollout
            run: kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=300s

    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        needs: deploy
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 'lts/*'

          - name: Install semantic-release
            run: npm ci

          - name: Run semantic-release
            run: npx semantic-release
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GIT_AUTHOR_NAME: github-actions[bot]
                GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                GIT_COMMITTER_NAME: github-actions[bot]
                GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
