---
name: Deploy

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        environment: prod
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'

          - name: Setup node.js
            uses: actions/setup-node@v4
            with:
                node-version: '24'

          - name: Install dependencies
            working-directory: MtdrSpring/backend/src/main/frontend
            run: npm ci --ignore-scripts

        #   - name: Build and test with Maven
        #     working-directory: MtdrSpring/backend
        #     run: |
        #         chmod +x mvnw
        #         ./mvnw verify -B

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to OCI Container Registry
            uses: docker/login-action@v3
            with:
                registry: ${{ secrets.OCI_REGION }}.ocir.io
                username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_AUTH_TOKEN }}

          - name: Build and push Docker image
            uses: docker/build-push-action@v6
            with:
                context: MtdrSpring/backend
                push: true
                tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:0.1

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-test
        environment: prod
        steps:
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4

          - name: Configure kubeconfig
            run: |
                mkdir -p $HOME/.kube
                echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config

          - name: Rollout restart
            run: kubectl rollout restart deployment/todolistapp-springboot-deployment -n mtdrworkshop

          - name: Wait for rollout
            run: kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=300s
