---
name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            version:
                description: 'Git tag, branch, or commit SHA to deploy (defaults to the ref that triggered the run)'
                required: false
                type: string

jobs:
    # Resolves the ref to deploy (the workflow_dispatch input, or the triggering
    # ref on push) into a concrete commit SHA. Every other job checks out this
    # ref and tags/pulls the image by the resolved SHA, so manual deploys of an
    # arbitrary version tag stay immutable and consistent across jobs.
    resolve:
        runs-on: ubuntu-latest
        outputs:
            ref: ${{ steps.r.outputs.ref }}
            sha: ${{ steps.r.outputs.sha }}
        steps:
          - name: Checkout requested ref
            uses: actions/checkout@v6
            with:
                ref: ${{ inputs.version || github.ref }}
                fetch-depth: 0

          - name: Resolve ref and commit SHA
            id: r
            run: |
                REF="${{ inputs.version || github.ref_name }}"
                SHA=$(git rev-parse HEAD)
                echo "ref=$REF" >> "$GITHUB_OUTPUT"
                echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                echo "Deploying ref '$REF' (commit $SHA)"

    # Provisions/refreshes all OCI infrastructure (OKE cluster + node pool, VCN,
    # ATP DB, bucket, container repo) from Terraform. Idempotent: a no-op when
    # everything already exists, and recreates it after an undeploy.
    infra:
        runs-on: ubuntu-latest
        needs: resolve
        environment: prod
        # Fail fast instead of hanging: Terraform provisioning (OKE + ATP)
        # normally finishes in ~15-25 min, so 30 min means something is stuck.
        timeout-minutes: 30
        outputs:
            cluster_id: ${{ steps.tf.outputs.cluster_id }}
        env:
            OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
            OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
            OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
            OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
            OCI_REGION: ${{ secrets.OCI_REGION }}
            OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
            TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
            AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
            TF_VAR_ociTenancyOcid: ${{ secrets.OCI_TENANCY_OCID }}
            TF_VAR_ociUserOcid: ${{ secrets.OCI_USER_OCID }}
            TF_VAR_ociCompartmentOcid: ${{ secrets.OCI_COMPARTMENT_OCID }}
            TF_VAR_ociRegionIdentifier: ${{ secrets.OCI_REGION }}
            TF_VAR_runName: ${{ secrets.RUN_NAME }}
            TF_VAR_mtdrDbName: ${{ secrets.TODO_PDB_NAME }}
            TF_VAR_mtdrKey: ${{ secrets.MTDR_KEY }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
            with:
                ref: ${{ needs.resolve.outputs.ref }}

          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
                terraform_wrapper: false

          - name: Install OCI CLI
            run: |
                curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
                bash install.sh --accept-all-defaults
                echo "$HOME/bin" >> $GITHUB_PATH

          - name: Configure OCI auth
            run: bash MtdrSpring/utils/ci/setup-oci-auth.sh

          - name: Terraform apply
            id: tf
            run: |
                bash MtdrSpring/utils/ci/terraform-apply.sh
                CID=$(terraform -chdir=MtdrSpring/terraform output -raw lab_oke_cluster_id)
                echo "cluster_id=$CID" >> "$GITHUB_OUTPUT"

    build:
        runs-on: ubuntu-latest
        needs: resolve
        environment: prod
        outputs:
            image: ${{ steps.build.outputs.image }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
            with:
                ref: ${{ needs.resolve.outputs.ref }}

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'

          - name: Setup node.js
            uses: actions/setup-node@v4
            with:
                node-version: '24'

          - name: Install dependencies
            working-directory: MtdrSpring/backend/src/main/frontend
            run: npm ci --ignore-scripts

          - name: Build with Maven
            working-directory: MtdrSpring/backend
            run: |
                chmod +x mvnw
                ./mvnw package -B -DskipTests

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
            with:
                # Use the daemon's built-in BuildKit instead of the default
                # docker-container driver, which boots by pulling moby/buildkit
                # from Docker Hub (flaky/rate-limited). We only do a single-arch
                # build+push, which the docker driver handles fine.
                driver: docker

          - name: Log in to OCI Container Registry
            uses: docker/login-action@v3
            with:
                registry: ${{ secrets.OCI_REGION }}.ocir.io
                username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_AUTH_TOKEN }}

          - name: Build and push Docker image
            id: build
            uses: docker/build-push-action@v6
            with:
                context: MtdrSpring/backend
                push: true
                no-cache: true
                tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ needs.resolve.outputs.sha }}

          - name: Output image reference
            run: echo "image=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ needs.resolve.outputs.sha }}" >> $GITHUB_OUTPUT
            id: build_output

    deploy:
        runs-on: ubuntu-latest
        needs: [resolve, infra, build]
        environment: prod
        env:
            OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
            OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
            OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
            OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
            OCI_REGION: ${{ secrets.OCI_REGION }}
            OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
            OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
            OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
            TF_VAR_ociCompartmentOcid: ${{ secrets.OCI_COMPARTMENT_OCID }}
            MTDR_DB_NAME: ${{ secrets.TODO_PDB_NAME }}
            DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
            UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
            OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
            CLUSTER_ID: ${{ needs.infra.outputs.cluster_id }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
            with:
                ref: ${{ needs.resolve.outputs.ref }}

          - name: Set up kubectl
            uses: azure/setup-kubectl@v4

          - name: Install OCI CLI
            run: |
                curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
                bash install.sh --accept-all-defaults
                echo "$HOME/bin" >> $GITHUB_PATH

          - name: Install Oracle Instant Client (sqlplus)
            run: |
                sudo apt-get update && sudo apt-get install -y alien unzip
                # Ubuntu 24.04 (noble) replaced libaio1 with libaio1t64, which
                # ships libaio.so.1t64 -- but sqlplus links against the old
                # soname libaio.so.1. Install it and symlink the expected name.
                sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
                if [ ! -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] && \
                   [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
                  sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 \
                             /usr/lib/x86_64-linux-gnu/libaio.so.1
                fi
                BASE=https://download.oracle.com/otn_software/linux/instantclient/2113000
                curl -fsSLO $BASE/oracle-instantclient-basic-21.13.0.0.0-1.el8.x86_64.rpm
                curl -fsSLO $BASE/oracle-instantclient-sqlplus-21.13.0.0.0-1.el8.x86_64.rpm
                sudo alien -i oracle-instantclient-basic-21.13.0.0.0-1.el8.x86_64.rpm
                sudo alien -i oracle-instantclient-sqlplus-21.13.0.0.0-1.el8.x86_64.rpm
                echo "/usr/lib/oracle/21/client64/bin" >> $GITHUB_PATH
                # Register the client libs so the linker finds libsqlplus.so /
                # libclntsh.so when sqlplus runs in this and later steps.
                echo /usr/lib/oracle/21/client64/lib | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
                sudo ldconfig

          - name: Configure OCI auth
            run: bash MtdrSpring/utils/ci/setup-oci-auth.sh

          - name: Bootstrap infra-dependent resources
            # Expose the embeddings PAR URL produced by terraform so the
            # bootstrap script can call DBMS_VECTOR.LOAD_ONNX_MODEL_CLOUD.
            run: |
                MINILM_ONNX_PAR_URL="$(terraform -chdir=MtdrSpring/terraform output -raw minilm_onnx_par_url 2>/dev/null || true)"
                export MINILM_ONNX_PAR_URL
                bash MtdrSpring/utils/ci/bootstrap-app.sh

          - name: Apply Kubernetes manifest
            working-directory: MtdrSpring/backend
            env:
                DOCKER_REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}
                TODO_PDB_NAME: ${{ secrets.TODO_PDB_NAME }}
                UI_USERNAME: ${{ secrets.UI_USERNAME }}
            run: |
                # Idempotent: creates the Deployment/Services if missing (e.g. after
                # undeploy), no-ops the rest if they already exist.
                sed -e "s|%DOCKER_REGISTRY%|${DOCKER_REGISTRY}|g" \
                    -e "s|%TODO_PDB_NAME%|${TODO_PDB_NAME}|g" \
                    -e "s|%OCI_REGION%|${OCI_REGION}|g" \
                    -e "s|%UI_USERNAME%|${UI_USERNAME}|g" \
                    src/main/resources/todolistapp-springboot.yaml \
                    | kubectl apply -n mtdrworkshop -f -

          - name: Update deployment image
            run: |
                kubectl set image deployment/todolistapp-springboot-deployment \
                    todolistapp-springboot=${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/todolistapp-springboot:${{ needs.resolve.outputs.sha }} \
                    -n mtdrworkshop

          - name: Wait for rollout
            run: kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=300s

    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        needs: deploy
        # Only cut a release on a normal push to main; manual deploys of an
        # existing version tag must not create a new release.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 'lts/*'

          - name: Install semantic-release
            run: npm ci

          - name: Run semantic-release
            run: npx semantic-release
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GIT_AUTHOR_NAME: github-actions[bot]
                GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                GIT_COMMITTER_NAME: github-actions[bot]
                GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
